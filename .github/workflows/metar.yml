name: METAR
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar METAR
        run: |
          curl -fsS -A "bitacora-vuelo/1.0" "https://aviationweather.gov/api/data/metar?ids=SCTB,SCEL,SCPD,SCSN,SCRD,SCRG,SCVM&format=json&hours=24" -o m.json
          python3 -c "import json,time;d=json.load(open('m.json'));json.dump({'t':int(time.time()),'m':d},open('metars.json','w'))"
          rm m.json
      - name: Guardar
        run: |
          git config user.name "metar-bot"
          git config user.email "metar-bot@users.noreply.github.com"
          git add metars.json
          git diff --cached --quiet || (git commit -m "METAR" && git push)
