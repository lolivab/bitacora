name: Keepalive Supabase
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta la base para evitar la pausa por inactividad
        run: |
          curl -fsS --retry 3 -X POST "https://utcfqzzcvjaohcwbadwd.supabase.co/rest/v1/rpc/estadisticas_publicas" \
            -H "apikey: sb_publishable_CTAzLFKRjFeJxAQYgrQLIw_eJH-_KU9" \
            -H "Content-Type: application/json" -d '{}' | head -c 200
